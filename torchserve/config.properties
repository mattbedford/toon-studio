# TorchServe configuration for Toon Studio.
# Adapted from facebookresearch/AnimatedDrawings (MIT).
#
# The container has no published ports and sits on an internal-only Docker
# network, so binding to 0.0.0.0 inside the container exposes nothing to the
# host or the LAN. It only lets the engine container reach it by service name.

inference_address=http://0.0.0.0:8080
management_address=http://0.0.0.0:8081
metrics_address=http://0.0.0.0:8082
model_store=/home/torchserve/model-store
load_models=all

# CPU only. One worker per model keeps memory predictable on an older machine.
default_workers_per_model=1
