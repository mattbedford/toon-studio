<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animate</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:,">
</head>
<body class="editor-page">
  <header class="topbar editor-bar">
    <a class="back" href="/">Toon Studio</a>
    <h1 id="title">Animate</h1>
    <div class="bar-actions">
      <span id="status" class="status" role="status"></span>
      <a id="edit-link" class="button-link" href="#">Edit skeleton</a>
    </div>
  </header>

  <main class="player">
    <div class="player-stage" id="stage-wrap"></div>

    <div class="player-controls">
      <label class="field inline">
        <span>Motion</span>
        <select id="motion" aria-label="Motion"></select>
      </label>
      <button id="play" class="primary" type="button">Pause</button>
      <label class="field inline">
        <span>Soft joints</span>
        <input id="bend" type="range" min="1" max="6" step="1" value="2">
      </label>
      <label class="check"><input type="checkbox" id="show-bones"> Show bones</label>
      <label class="check"><input type="checkbox" id="show-mesh"> Show mesh</label>
    </div>
  </main>

  <script src="vendor/pixi/pixi.min.js"></script>
  <script src="vendor/pixi/unsafe-eval.min.js"></script>
  <script type="module" src="js/player.js"></script>
</body>
</html>
